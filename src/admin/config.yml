# ============================================================
# Configuration Sveltia CMS : Les Saumons de Lionel
# Chaque champ ci-dessous édite un fichier de contenu du dépôt.
# À l'enregistrement : commit git, puis Netlify reconstruit le site.
#
# PRÉREQUIS (cf. README-CMS.md) :
#   - repo : le dépôt GitHub au nom de Rita
#   - en local (démo) : bouton « Work with local repository »
# ============================================================

backend:
  name: github
  # Compte PERSONNEL de Baptiste pour les tests : à transférer au compte
  # de Rita à la livraison (Transfer repository), puis mettre à jour ici.
  repo: baptisteeoche-bit/site-les-saumons-de-lionel
  branch: main

# Les images envoyées depuis le CMS sont rangées avec celles du site :
media_folder: "src/assets/img"
public_folder: "assets/img"

collections:
  # ---------------------------------------------------------
  # RÉGLAGES GLOBAUX (toutes les pages)
  # ---------------------------------------------------------
  - name: "reglages"
    label: "Réglages du site"
    icon: "settings"
    files:
      - name: "site"
        label: "Marque, coordonnées, sceau"
        file: "src/_data/site.json"
        fields:
          - { name: "nom", label: "Nom de la marque", widget: "string" }
          - { name: "baseline", label: "Phrase de pied de page", widget: "text" }
          - name: "contact"
            label: "Coordonnées (pied de page et page Contact)"
            widget: "object"
            fields:
              - { name: "responsable", label: "Nom affiché", widget: "string" }
              - { name: "email", label: "E-mail de contact", widget: "string" }
              - name: "tel"
                label: "Téléphone"
                widget: "object"
                fields:
                  - { name: "numero", label: "Numéro affiché (ex. 07 59 60 12 33)", widget: "string" }
                  - { name: "lien", label: "Numéro pour le lien d'appel (format +33…)", widget: "string" }
              - { name: "whatsapp", label: "Lien WhatsApp (ex. https://wa.me/33759601233, vide = bouton masqué)", widget: "string", required: false }
              - { name: "facebook", label: "Adresse de la page Facebook (vide = lien masqué)", widget: "string", required: false }
              - { name: "instagram", label: "Adresse Instagram (vide = lien masqué)", widget: "string", required: false }
              - { name: "adresse", label: "Adresse postale", widget: "string" }
          - name: "sceau"
            label: "Sceau « Since 1994 »"
            widget: "object"
            fields:
              - { name: "haut", label: "Texte du haut (ex. Wild Sockeye Salmon)", widget: "string" }
              - { name: "bas", label: "Texte du bas (ex. From Alaska · Since 1994)", widget: "string" }
              - { name: "annee", label: "Année", widget: "string" }
          - { name: "ogImage", label: "Image de partage (réseaux sociaux)", widget: "image" }
          - { name: "favicon", label: "Favicon (icône d'onglet)", widget: "image" }

  # ---------------------------------------------------------
  # PRODUITS (source unique : page Nos produits et cartes de l'accueil)
  # ---------------------------------------------------------
  - name: "catalogue"
    label: "Produits"
    icon: "storefront"
    files:
      - name: "produits"
        label: "Fiches produits"
        file: "src/_data/produits.json"
        fields:
          - name: "liste"
            label: "Produits (page Nos produits)"
            label_singular: "produit"
            widget: "list"
            summary: "{{fields.nom}}"
            fields:
              - { name: "id", label: "Identifiant technique (minuscules, tirets, sans accent)", widget: "string", hint: "Sert d'ancre de lien, ex. filet-saumon" }
              - { name: "eyebrow", label: "Sur-titre (origine / label)", widget: "string", hint: "Ex. Alaska · Pêche sauvage" }
              - { name: "nom", label: "Nom complet du produit", widget: "string" }
              - { name: "court", label: "Nom court (cartes de l'accueil)", widget: "string" }
              - { name: "infos", label: "Ligne d'infos (réf. · poids · mention)", widget: "string", hint: "Ex. Réf. SAU-FIL-1000 · ≈ 1 kg · Tranché, sous vide" }
              - { name: "sousTitre", label: "Sous-titre (cartes de l'accueil)", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "legende", label: "Légende sur la photo (lieu, date, crédit)", widget: "string", required: false }
              - { name: "label", label: "Étiquette label (ex. AB, vide = rien)", widget: "string", required: false }
              - { name: "prixPublic", label: "Tarif particulier affiché (ex. 98,90 € TTC le kilo, vide = rien)", widget: "string", required: false }
              - { name: "prixNote", label: "Mention sous le tarif particulier", widget: "string", required: false }
              - name: "specs"
                label: "Relevé de traçabilité"
                widget: "object"
                fields:
                  - { name: "espece", label: "Espèce", widget: "string" }
                  - { name: "origine", label: "Origine", widget: "string" }
                  - { name: "preparation", label: "Préparation", widget: "string" }
                  - { name: "conservation", label: "Conservation", widget: "string" }
                  - { name: "allergenes", label: "Allergènes", widget: "string" }

  # ---------------------------------------------------------
  # PAGES
  # ---------------------------------------------------------
  - name: "pages"
    label: "Pages"
    icon: "article"
    files:
      # ------------------ ACCUEIL ------------------
      - name: "accueil"
        label: "Accueil"
        file: "src/_data/accueil.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
              - { name: "ogTitre", label: "Titre de partage (réseaux sociaux)", widget: "string" }
              - { name: "ogDescription", label: "Description de partage", widget: "text" }
          - name: "hero"
            label: "Grand bandeau d'entrée"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "Gardez <em>…</em> pour la partie en italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
              - { name: "boutonPrincipal", label: "Texte du bouton principal", widget: "string" }
              - { name: "boutonSecondaire", label: "Texte du bouton secondaire", widget: "string" }
              - { name: "noteBas", label: "Ligne de réassurance (bas du bandeau)", widget: "string" }
              - { name: "imageFond", label: "Photo de fond", widget: "image" }
              - { name: "legende", label: "Légende de la photo (lieu, saison)", widget: "string", required: false }
          - name: "faits"
            label: "Bloc « Trois faits »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "liste"
                label: "Les trois faits"
                label_singular: "fait"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "label", label: "Étiquette", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "produits"
            label: "Bloc « Nos produits » (habillage, les cartes viennent des fiches produits)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - { name: "note", label: "Mention en pied de carte", widget: "string" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }
              - { name: "horsCseLien", label: "Texte du lien pour les particuliers", widget: "string" }
          - name: "histoire"
            label: "Bloc « Lionel » (résumé de l'histoire)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "legende", label: "Légende sur la photo (lieu, date, qui)", widget: "string", required: false }
              - { name: "lien", label: "Texte du lien vers Notre histoire", widget: "string" }
          - name: "avis"
            label: "Bloc « Avis clients » (masqué tant que la liste est vide)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "liste"
                label: "Retours clients"
                label_singular: "retour"
                widget: "list"
                required: false
                summary: "{{fields.auteur}}"
                fields:
                  - { name: "texte", label: "La phrase, telle quelle (sans guillemets)", widget: "text" }
                  - { name: "auteur", label: "Prénom (ou prénom et initiale)", widget: "string" }
                  - { name: "contexte", label: "CSE ou entreprise (facultatif)", widget: "string", required: false }
          - name: "cse"
            label: "Bloc « Offres CSE » (bandeau sombre)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string", hint: "&amp; = le signe &" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "texte", label: "Texte", widget: "text" }
              - { name: "codeExemple", label: "Code partenaire montré en exemple", widget: "string" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }
              - { name: "lien", label: "Texte du lien vers les Offres CSE", widget: "string" }
              - { name: "imageFond", label: "Image de fond", widget: "image" }
          - name: "froid"
            label: "Bloc « Chaîne du froid » (4 étapes)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "etapes"
                label: "Étapes"
                label_singular: "étape"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "temp", label: "Repère (température ou lieu, ex. -18 °C)", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }

      # ------------------ NOS PRODUITS (habillage) ------------------
      - name: "nosproduits"
        label: "Nos produits (habillage de page)"
        file: "src/_data/nosproduits.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
          - name: "pourquoi"
            label: "Bloc « Pourquoi choisir un saumon sauvage d'Alaska ? »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "intro", label: "Texte d'introduction", widget: "text" }
              - name: "points"
                label: "Points"
                label_singular: "point"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "prix"
            label: "Bloc « Tarifs »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "texte", label: "Texte", widget: "text" }
              - { name: "tarifsTitre", label: "Titre de la grille des tarifs particuliers", widget: "string" }
              - { name: "tarifsNote", label: "Mention sous la grille (poids réel)", widget: "text" }
              - { name: "disponibilites", label: "Phrase sur les disponibilités", widget: "text" }
              - { name: "boutonCode", label: "Texte du bouton code CSE", widget: "string" }
              - { name: "boutonContact", label: "Texte du bouton contact", widget: "string" }

      # ------------------ NOTRE HISTOIRE ------------------
      - name: "histoire"
        label: "Notre histoire"
        file: "src/_data/histoire.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
          - name: "lionel"
            label: "1. Lionel et l'Alaska, dès les années 80"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "provisoire", label: "Mention « texte provisoire » (vider pour la retirer)", widget: "string", required: false }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "legende", label: "Légende sur la photo (lieu, date, qui)", widget: "string", required: false }
          - name: "famille"
            label: "2. Une entreprise familiale depuis 1994"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "provisoire", label: "Mention « texte provisoire » (vider pour la retirer)", widget: "string", required: false }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "legende", label: "Légende sur la photo (lieu, date, qui)", widget: "string", required: false }
          - name: "parcours"
            label: "3. De la pêche à la table (frise)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "etapes"
                label: "Étapes"
                label_singular: "étape"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "periode", label: "Repère (lieu, température, moment)", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "exergue"
            label: "Bloc de fin (sceau et phrase)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "imageFond", label: "Image de fond", widget: "image" }
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Phrase", widget: "text", hint: "<em>…</em> = italique" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }

      # ------------------ OFFRES CSE ------------------
      - name: "cse"
        label: "Offres CSE"
        file: "src/_data/cse.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string", hint: "&amp; = le signe &" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "boutonPrincipal", label: "Texte du bouton principal", widget: "string" }
              - { name: "boutonSecondaire", label: "Texte du bouton secondaire", widget: "string" }
          - name: "partenariat"
            label: "Bloc « Un partenariat en trois gestes »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - name: "gestes"
                label: "Les trois gestes"
                label_singular: "geste"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
          - name: "salarie"
            label: "Bloc « Côté salarié »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "codeExemple", label: "Code partenaire montré en exemple", widget: "string" }
              - { name: "lien", label: "Texte du lien vers la commande", widget: "string" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "badge", label: "Badge sur la photo", widget: "string" }
          - name: "references"
            label: "Bloc « Ils nous font confiance » (masqué si la liste est vide)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "texte", label: "Texte de côté", widget: "text" }
              - name: "liste"
                label: "Références"
                label_singular: "référence"
                widget: "list"
                required: false
                summary: "{{fields.nom}}"
                fields:
                  - { name: "nom", label: "Nom (ex. COSAT Toulouse)", widget: "string" }
                  - { name: "detail", label: "Précision (ville, CSE, depuis quand)", widget: "string", required: false }
          - name: "engagements"
            label: "Bloc « Ce que votre comité y gagne »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "points"
                label: "Points (numérotés automatiquement)"
                label_singular: "point"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "contact"
            label: "Bloc « Devenir partenaire » (contact)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - { name: "besoin", label: "Texte « Ce qu'il nous faut »", widget: "text" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }

      # ------------------ CONTACT ------------------
      - name: "contact"
        label: "Contact"
        file: "src/_data/contact.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
          - name: "horsCse"
            label: "Bloc « Commander hors CSE ? »"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texte", label: "Texte", widget: "text" }
          - name: "formulaire"
            label: "Formulaire"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "profils"
                label: "Choix « Je suis »"
                label_singular: "profil"
                widget: "list"
                field: { name: "texte", label: "Libellé", widget: "string" }
