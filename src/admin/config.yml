# ============================================================
# Configuration Sveltia CMS — Les Saumons de Lionel
# Chaque champ ci-dessous édite un fichier de contenu du dépôt.
# À l'enregistrement : commit git → Netlify reconstruit le site.
#
# ⚠️ PRÉREQUIS (à renseigner par Baptiste, cf. README-CMS.md) :
#   - repo : le dépôt GitHub créé AU NOM DE RITA
#   - en local (démo) : bouton « Work with local repository »
# ============================================================

backend:
  name: github
  # ⚠️ Compte PERSONNEL de Baptiste pour les tests — à transférer au compte
  # de Rita à la livraison (Transfer repository), puis mettre à jour ici.
  repo: baptisteeoche-bit/site-les-saumons-de-lionel
  branch: main

# Les images envoyées depuis le CMS sont rangées avec celles du site :
media_folder: "src/assets/img"
public_folder: "assets/img"

collections:
  # ---------------------------------------------------------
  # RÉGLAGES GLOBAUX (toutes les pages)
  # ---------------------------------------------------------
  - name: "reglages"
    label: "Réglages du site"
    icon: "settings"
    files:
      - name: "site"
        label: "Marque & coordonnées"
        file: "src/_data/site.json"
        fields:
          - { name: "nom", label: "Nom de la marque", widget: "string" }
          - name: "contact"
            label: "Coordonnées"
            widget: "object"
            fields:
              - { name: "email", label: "E-mail de contact", widget: "string" }
              - name: "tel1"
                label: "Téléphone 1"
                widget: "object"
                fields:
                  - { name: "prenom", label: "Prénom affiché", widget: "string" }
                  - { name: "numero", label: "Numéro affiché (ex. 07 81 71 51 27)", widget: "string" }
                  - { name: "lien", label: "Numéro pour le lien d'appel (format +33…)", widget: "string" }
              - name: "tel2"
                label: "Téléphone 2"
                widget: "object"
                fields:
                  - { name: "prenom", label: "Prénom affiché", widget: "string" }
                  - { name: "numero", label: "Numéro affiché", widget: "string" }
                  - { name: "lien", label: "Numéro pour le lien d'appel (format +33…)", widget: "string" }
              - { name: "adresse", label: "Adresse postale", widget: "string" }
          - { name: "ogImage", label: "Image de partage (réseaux sociaux)", widget: "image" }
          - { name: "favicon", label: "Favicon (icône d'onglet)", widget: "image" }

  # ---------------------------------------------------------
  # PRODUITS (source unique de la page « La sélection »)
  # ---------------------------------------------------------
  - name: "catalogue"
    label: "Produits"
    icon: "storefront"
    files:
      - name: "produits"
        label: "Fiches produits"
        file: "src/_data/produits.json"
        fields:
          - name: "liste"
            label: "Produits (page La sélection)"
            label_singular: "produit"
            widget: "list"
            summary: "{{fields.nom}}"
            fields:
              - { name: "id", label: "Identifiant technique (minuscules, tirets, sans accent)", widget: "string", hint: "Sert d'ancre de lien, ex. filet-saumon" }
              - { name: "eyebrow", label: "Sur-titre (origine / label)", widget: "string", hint: "Ex. Alaska · Pêche sauvage" }
              - { name: "nom", label: "Nom du produit", widget: "string" }
              - { name: "infos", label: "Ligne d'infos (réf. · poids · mention)", widget: "string", hint: "Ex. Réf. SAU-FIL-1000 · ≈ 1 kg · Tranché main" }
              - { name: "description", label: "Description", widget: "text" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description de la photo (accessibilité)", widget: "string" }
              - name: "specs"
                label: "Caractéristiques"
                widget: "object"
                fields:
                  - { name: "origine", label: "Origine", widget: "string" }
                  - { name: "poids", label: "Poids", widget: "string" }
                  - { name: "allergenes", label: "Allergènes", widget: "string" }
                  - { name: "conservation", label: "Conservation", widget: "string" }

  # ---------------------------------------------------------
  # PAGES
  # ---------------------------------------------------------
  - name: "pages"
    label: "Pages"
    icon: "article"
    files:
      # ------------------ ACCUEIL ------------------
      - name: "accueil"
        label: "Accueil"
        file: "src/_data/accueil.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
              - { name: "ogTitre", label: "Titre de partage (réseaux sociaux)", widget: "string" }
              - { name: "ogDescription", label: "Description de partage", widget: "text" }
          - name: "hero"
            label: "Grand bandeau d'entrée"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "Gardez <em>…</em> pour la partie en italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
              - { name: "boutonPrincipal", label: "Texte du bouton principal", widget: "string" }
              - { name: "boutonSecondaire", label: "Texte du bouton secondaire", widget: "string" }
              - { name: "noteBas", label: "Ligne de réassurance (bas du bandeau)", widget: "string" }
              - { name: "imageFond", label: "Image de fond", widget: "image" }
          - name: "manifesto"
            label: "Bloc « La maison »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<br> = saut de ligne, <em>…</em> = italique" }
              - name: "piliers"
                label: "Les trois piliers"
                label_singular: "pilier"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "label", label: "Étiquette", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "selection"
            label: "Bloc « La sélection » (cartes produits)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "&amp; = le signe &" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - name: "cartes"
                label: "Cartes produits (résumé pour l'accueil)"
                label_singular: "carte"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "tag", label: "Étiquette sur la photo", widget: "string" }
                  - { name: "image", label: "Photo", widget: "image" }
                  - { name: "alt", label: "Description de la photo (accessibilité)", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "sousTitre", label: "Sous-titre", widget: "string" }
                  - { name: "description", label: "Description courte", widget: "text" }
                  - { name: "note", label: "Mention en pied de carte", widget: "string" }
          - name: "process"
            label: "Bloc « Le geste » (4 étapes)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "etapes"
                label: "Étapes"
                label_singular: "étape"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "numero", label: "Numéro et mot-clé (ex. 01 — Océan)", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "cse"
            label: "Bloc « Espace CSE »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string", hint: "&amp; = le signe &" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "texte", label: "Texte", widget: "text" }
              - { name: "codeExemple", label: "Code partenaire montré en exemple", widget: "string" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }
              - { name: "lien", label: "Texte du lien vers l'Espace CSE", widget: "string" }
              - { name: "imageFond", label: "Image de fond", widget: "image" }

      # ------------------ LA SÉLECTION (habillage) ------------------
      - name: "selection"
        label: "La sélection (habillage de page)"
        file: "src/_data/selection.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
          - name: "noteFroid"
            label: "Bloc « Le froid, notre promesse »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texte", label: "Texte", widget: "text" }

      # ------------------ NOTRE HISTOIRE ------------------
      - name: "histoire"
        label: "Notre histoire"
        file: "src/_data/histoire.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }
          - name: "recit"
            label: "Récit de Lionel"
            widget: "object"
            fields:
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "badge", label: "Badge sur la photo", widget: "string" }
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "signature", label: "Signature (phrase en exergue)", widget: "string" }
          - name: "timeline"
            label: "Frise « Le chemin d'une pièce »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "etapes"
                label: "Étapes"
                label_singular: "étape"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "periode", label: "Moment / lieu (ex. Atelier · Feu doux)", widget: "string" }
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "promesse"
            label: "Bloc citation « La promesse »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "imageFond", label: "Image de fond", widget: "image" }
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "citation", label: "Citation", widget: "text", hint: "<br> = saut de ligne, <em>…</em> = italique" }
              - { name: "bouton", label: "Texte du bouton", widget: "string" }

      # ------------------ ESPACE CSE ------------------
      - name: "cse"
        label: "Espace CSE"
        file: "src/_data/cse.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string", hint: "&amp; = le signe &" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string", hint: "&amp; = le signe &" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "boutonPrincipal", label: "Texte du bouton principal", widget: "string" }
              - { name: "boutonSecondaire", label: "Texte du bouton secondaire", widget: "string" }
          - name: "partenariat"
            label: "Bloc « Un partenariat en trois gestes »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - name: "gestes"
                label: "Les trois gestes"
                label_singular: "geste"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
          - name: "salarie"
            label: "Bloc « Côté salarié »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - { name: "codeExemple", label: "Code partenaire montré en exemple", widget: "string" }
              - { name: "lien", label: "Texte du lien vers la commande", widget: "string" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string" }
              - { name: "badge", label: "Badge sur la photo", widget: "string" }
          - name: "engagements"
            label: "Bloc « Ce que votre comité y gagne »"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "points"
                label: "Points (numérotés automatiquement)"
                label_singular: "point"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { name: "titre", label: "Titre", widget: "string" }
                  - { name: "texte", label: "Texte", widget: "text" }
          - name: "contact"
            label: "Bloc « Devenir partenaire » (contact)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texteCote", label: "Texte de côté", widget: "text" }
              - { name: "noteEmail", label: "Note sous l'e-mail", widget: "string" }
              - { name: "besoin", label: "Texte « Ce qu'il nous faut »", widget: "text" }

      # ------------------ COMMANDER (habillage) ------------------
      - name: "commande"
        label: "Commander (habillage de page)"
        file: "src/_data/commande.json"
        fields:
          - name: "seo"
            label: "Référencement (SEO)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
              - { name: "description", label: "Description Google", widget: "text" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - { name: "accroche", label: "Texte d'accroche", widget: "text" }

      # ------------------ PAGES LÉGALES ------------------
      - name: "mentions"
        label: "Mentions légales"
        file: "src/mentions.md"
        fields:
          - { name: "layout", widget: "hidden" }
          - { name: "permalink", widget: "hidden" }
          - { name: "noindex", widget: "hidden" }
          - { name: "footerSimple", widget: "hidden" }
          - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
          - { name: "body", label: "Contenu", widget: "markdown" }

      - name: "confidentialite"
        label: "Politique de confidentialité"
        file: "src/confidentialite.md"
        fields:
          - { name: "layout", widget: "hidden" }
          - { name: "permalink", widget: "hidden" }
          - { name: "noindex", widget: "hidden" }
          - { name: "footerSimple", widget: "hidden" }
          - { name: "titre", label: "Titre de l'onglet (balise title)", widget: "string" }
          - name: "hero"
            label: "En-tête de page"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string" }
          - { name: "body", label: "Contenu", widget: "markdown" }
