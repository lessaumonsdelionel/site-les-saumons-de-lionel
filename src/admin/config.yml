              - { name: "titreModes", label: "Titre de l'étape livraison", widget: "string" }
              - { name: "erreurModes", label: "Message si aucun mode n'est choisi", widget: "string" }
              - { name: "libelleFrais", label: "Nom des frais (ex. Frais de livraison)", widget: "string" }
              - { name: "libelleRecuperation", label: "Ligne livraison sur la confirmation", widget: "string" }
              - { name: "noteEstimatif", label: "Note sous le total (poids réel)", widget: "text" }
              - { name: "placeholderCommentaire", label: "Exemple dans le champ commentaire", widget: "string" }
          - name: "entreprise"
            label: "5. Vous commandez pour votre entreprise"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Sur-titre", widget: "string" }
              - { name: "titre", label: "Titre", widget: "string", hint: "<em>…</em> = italique" }
              - name: "paragraphes"
                label: "Paragraphes"
                label_singular: "paragraphe"
                widget: "list"
                field: { name: "texte", label: "Texte", widget: "text", hint: "<strong>…</strong> = gras" }
              - name: "operations"
                label: "Opérations proposées dans le formulaire"
                label_singular: "opération"
                widget: "list"
                field: { name: "operation", label: "Opération", widget: "string" }
              - { name: "rgpd", label: "Case de consentement (suivie du lien vers la politique de confidentialité)", widget: "text" }
              - { name: "bouton", label: "Bouton d'envoi", widget: "string" }
              - { name: "merci", label: "Message après l'envoi", widget: "text" }
              - { name: "image", label: "Photo sous les textes (masquée sur téléphone)", widget: "image", required: false }
              - { name: "imageAlt", label: "Description de la photo (accessibilité)", widget: "string", required: false }
              - { name: "legende", label: "Légende sur la photo", widget: "string", required: false }
          - name: "calendrier"
            label: "6. Calendrier"
            widget: "object"
            fields:
              - { name: "titre", label: "Titre", widget: "string" }
              - name: "dates"
