              - { name: "sous", label: "Texte du panneau du code", widget: "text" }
              - { name: "libelleTarif", label: "Nom du tarif (ex. Tarif CCIFA)", widget: "string" }
              - { name: "libelleRemise", label: "Nom de la remise", widget: "string" }
              - { name: "noteRecap", label: "Note sous le bouton de validation", widget: "text" }
